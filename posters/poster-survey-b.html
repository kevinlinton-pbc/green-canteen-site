<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Green Canteen – Green Canteen – Survey poster B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho&display=swap">
<style>
:root{--bgc:#DFFEAE;--headfill:#fff;--tagfill:#FFE1FE;--hvid:#fff;--lys:#DFFEAE;--gron:#36471D;--mork:#1A2805;--pink:#FFE1FE;--display:"BIZ UDPMincho","Hiragino Mincho ProN",Georgia,serif;--body:"Helvetica Neue",Helvetica,Arial,sans-serif}
@page{size:297mm 420mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
.poster{width:297mm;height:420mm;background:var(--bgc);color:var(--mork);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:16mm 22mm 16mm;justify-content:space-between;font-family:var(--body)}
.bg{position:absolute;inset:0;width:100%;height:100%}
.poster>*:not(.bg){position:relative}
.brand{display:flex;align-items:center;gap:5mm;background:var(--hvid);border:.6mm solid var(--mork);border-radius:999px;padding:4mm 10mm 4mm 7mm;font-family:var(--display);font-size:14mm;line-height:1;color:var(--mork)}
.brand .logo{width:15mm;height:auto;flex:none}
.head{width:226mm}
.sticker{display:block;overflow:visible}
.sticker text{font-family:var(--display);letter-spacing:-.045em;word-spacing:.06em}
.sticker .l3{fill:var(--mork);stroke:var(--mork)}
.sticker .l2{fill:var(--s-fill,var(--hvid));stroke:var(--s-fill,var(--hvid))}
.head{--s-fill:var(--headfill)}
.tag{--s-fill:var(--tagfill)}
.sticker .l1{fill:var(--mork)}
.sticker.plain text{font-family:var(--body);letter-spacing:0;word-spacing:0}
.head .sticker .l2,.head .sticker .l3{filter:url(#sticker-flat)}
.sticker.plain .l2,.sticker.plain .l3{filter:url(#sticker-soft)}
.sticker .l2,.sticker .l3{stroke-linejoin:round;stroke-linecap:round;filter:url(#sticker-smooth)}
[data-fill=pink]{--s-fill:var(--pink)}
.tag{width:150mm;transform:rotate(-5deg)}
.facts{display:flex;gap:7mm}
.pill{border:.6mm solid var(--mork);border-radius:999px;background:var(--hvid);padding:4mm 9mm;font-family:var(--display);font-size:11mm;line-height:1}
.lede{margin:0}
.cta{display:flex;align-items:center;gap:10mm;background:var(--mork);color:var(--lys);border-radius:12mm;padding:8mm 14mm 8mm 8mm;width:fit-content;border:.8mm solid var(--lys)}
.cta .qr{width:38mm;height:38mm;background:var(--lys);border-radius:4mm;padding:3.2mm;flex:none}
.cta .qr svg{width:100%;height:100%;display:block}
.cta h3{font-family:var(--display);font-weight:400;font-size:13mm;line-height:1.05;margin:0}
.cta p{margin:3mm 0 0;font-size:6mm;line-height:1.35}
.cta b{font-weight:500;background:var(--pink);color:var(--mork);padding:.6mm 3mm;border-radius:999px;display:inline-block;margin-top:2mm}

.poster{--bgc:#FFE1FE}
.head{width:196mm;--s-fill:#fff}
.rate{display:flex;flex-direction:column;align-items:center;gap:4mm}
.rate .row{display:flex;gap:6mm}
.rate .dot{width:32mm;height:32mm;border-radius:50%;background:var(--hvid);border:.8mm solid var(--mork);display:grid;place-items:center;font-family:var(--display);font-size:19mm;line-height:1}
.rate .dot:nth-child(5){background:var(--lys)}
.rate .ends{display:flex;justify-content:space-between;width:100%;font-size:5.6mm;font-weight:500;letter-spacing:.04em;background:var(--hvid);border:.6mm solid var(--mork);border-radius:999px;padding:2.4mm 9mm}
.cta{width:fit-content}
.cta .qr{width:50mm;height:50mm;padding:3.6mm}

</style></head><body>

<script>
(()=>{const cv=document.getElementById("bg"),c=cv.getContext("2d"),W=cv.width,H=cv.height;
function ripples(){const P=document.querySelector(".poster").getBoundingClientRect(),T=document.querySelector(".rate").getBoundingClientRect(),k0=W/P.width;
const cx=(T.left+T.width/2-P.left)*k0,cy=(T.top+T.height/2-P.top)*k0,rx0=T.width*k0*.52,ry0=T.height*k0*.95,rot=0*Math.PI/180,step=W/15;
c.setTransform(1,0,0,1,0,0);c.fillStyle="#FFE1FE";c.fillRect(0,0,W,H);
for(let k=34;k>=0;k--){c.beginPath();const rx=rx0+k*step,ry=ry0+k*step;
for(let a=0;a<=Math.PI*2+.01;a+=.02){const wob=1+.045*Math.sin(a*6+1)+.02*Math.sin(a*11+2)+.03*Math.sin(a*3+k*.35);
const ex=Math.cos(a)*rx*wob,ey=Math.sin(a)*ry*wob,x=cx+ex*Math.cos(rot)-ey*Math.sin(rot),y=cy+ex*Math.sin(rot)+ey*Math.cos(rot);a===0?c.moveTo(x,y):c.lineTo(x,y)}
c.closePath();c.fillStyle=k%2?"#FFE1FE":"#36471D";c.fill();c.lineWidth=5;c.strokeStyle="#36471D";c.stroke()}}
const NS="http://www.w3.org/2000/svg";
function build(host){const plain=!!host.dataset.plain,lines=host.dataset.sticker.split("|"),size=+host.dataset.size||90,lh=plain?size*1.5:size,inner=size*(plain?2.9:.62),outer=inner+size*(plain?.2:.12);
const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","sticker"+(plain?" plain":""));
const make=(c,sw)=>{const g=document.createElementNS(NS,"g");g.setAttribute("class",c);if(sw)g.setAttribute("stroke-width",sw);
lines.forEach((t,i)=>{const x=document.createElementNS(NS,"text");x.setAttribute("x",0);x.setAttribute("y",i*lh);x.setAttribute("text-anchor","middle");x.setAttribute("font-size",size);x.textContent=t;g.appendChild(x)});return g};
svg.append(make("l3",outer),make("l2",inner),make("l1"));host.replaceChildren(svg);
const fit=()=>{const b=svg.querySelector(".l1").getBBox(),p=outer/2+2;svg.setAttribute("viewBox",`${b.x-p} ${b.y-p} ${b.width+p*2} ${b.height+p*2}`);svg.style.width=plain?((b.width+p*2)*host.dataset.mm/size)+"mm":"100%";svg.style.height="auto"};fit();return fit}
const f=[...document.querySelectorAll("[data-sticker]")].map(build);
document.fonts.ready.then(()=>{f.forEach(x=>x());ripples();document.body.dataset.ready=1});})();
</script></body></html>
