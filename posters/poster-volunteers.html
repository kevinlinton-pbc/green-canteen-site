<style>
:root{--hvid:#fff;--lys:#DFFEAE;--gron:#36471D;--mork:#1A2805;--pink:#FFE1FE;--display:"BIZ UDPMincho","Hiragino Mincho ProN",Georgia,serif;--body:"Helvetica Neue",Helvetica,Arial,sans-serif}
@page{size:297mm 420mm;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
.poster{width:297mm;height:420mm;background:var(--lys);color:var(--mork);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding:16mm 22mm 14mm;font-family:var(--body)}
.bg{position:absolute;inset:0;width:100%;height:100%}
.poster>*:not(.bg){position:relative}
.brand{display:flex;align-items:center;gap:5mm;background:var(--hvid);border:.6mm solid var(--mork);border-radius:999px;padding:4mm 10mm 4mm 7mm;font-family:var(--display);font-size:14mm;line-height:1;color:var(--mork)}
.brand .logo{width:15mm;height:auto;flex:none}
.head{width:226mm;margin-top:14mm}
.sticker{display:block;overflow:visible}
.sticker text{font-family:var(--display);letter-spacing:-.045em;word-spacing:.06em}
.sticker .l3{fill:var(--mork);stroke:var(--mork)}
.sticker .l2{fill:var(--s-fill,var(--hvid));stroke:var(--s-fill,var(--hvid))}
.sticker .l1{fill:var(--mork)}
.sticker .l2,.sticker .l3{stroke-linejoin:round;stroke-linecap:round;filter:url(#sticker-smooth)}
[data-fill=pink]{--s-fill:var(--pink)}
.tag{width:150mm;margin-top:-4mm;transform:rotate(-5deg)}
.facts{display:flex;gap:7mm;margin-top:16mm}
.pill{border:.6mm solid var(--mork);border-radius:999px;background:var(--hvid);padding:4mm 9mm;font-family:var(--display);font-size:11mm;line-height:1}
.lede{font-size:6.6mm;line-height:1.45;text-align:center;width:fit-content;white-space:nowrap;margin:9mm 0 0;background:var(--hvid);border:.6mm solid var(--mork);border-radius:9mm;padding:6mm 10mm}
.cta{margin-top:auto;display:flex;align-items:center;gap:10mm;background:var(--mork);color:var(--lys);border-radius:12mm;padding:8mm 12mm;width:100%;border:.8mm solid var(--lys)}
.cta .qr{width:38mm;height:38mm;background:var(--lys);border-radius:4mm;padding:3.2mm;flex:none}
.cta .qr svg{width:100%;height:100%;display:block}
.cta h3{font-family:var(--display);font-weight:400;font-size:13mm;line-height:1.05;margin:0}
.cta p{margin:3mm 0 0;font-size:6mm;line-height:1.35}
.cta b{font-weight:500;background:var(--pink);color:var(--mork);padding:.6mm 3mm;border-radius:999px;display:inline-block;margin-top:2mm}

<script>
(()=>{const cv=document.getElementById("bg"),c=cv.getContext("2d"),W=cv.width,H=cv.height;
c.fillStyle="#DFFEAE";c.fillRect(0,0,W,H);const cx=W*.5,cy=H*.46,seed=1;
for(let k=26;k>=1;k--){c.beginPath();const base=k*W/16;
for(let a=0;a<=Math.PI*2+.01;a+=.02){const wob=1+.07*Math.sin(a*6+seed)+.03*Math.sin(a*11+seed*2);
const x=cx+Math.cos(a)*base*wob*1.1,y=cy+Math.sin(a)*base*wob*1.15;a===0?c.moveTo(x,y):c.lineTo(x,y)}
c.closePath();c.fillStyle=k%2?"#36471D":"#DFFEAE";c.fill();c.lineWidth=5;c.strokeStyle="#36471D";c.stroke()}
const NS="http://www.w3.org/2000/svg";
function build(host){const lines=host.dataset.sticker.split("|"),size=+host.dataset.size||90,inner=size*.62,outer=inner+size*.12;
const svg=document.createElementNS(NS,"svg");svg.setAttribute("class","sticker");
const make=(c,sw)=>{const g=document.createElementNS(NS,"g");g.setAttribute("class",c);if(sw)g.setAttribute("stroke-width",sw);
lines.forEach((t,i)=>{const x=document.createElementNS(NS,"text");x.setAttribute("x",0);x.setAttribute("y",i*size);x.setAttribute("text-anchor","middle");x.setAttribute("font-size",size);x.textContent=t;g.appendChild(x)});return g};
svg.append(make("l3",outer),make("l2",inner),make("l1"));host.replaceChildren(svg);
const fit=()=>{const b=svg.querySelector(".l1").getBBox(),p=outer/2+2;svg.setAttribute("viewBox",`${b.x-p} ${b.y-p} ${b.width+p*2} ${b.height+p*2}`);svg.style.width="100%";svg.style.height="auto"};fit();return fit}
const f=[...document.querySelectorAll("[data-sticker]")].map(build);
document.fonts.ready.then(()=>{f.forEach(x=>x());document.body.dataset.ready=1});})();
</script></body></html>
